StylesPath = styles
MinAlertLevel = suggestion

Vocab = Fhenix

[formats]
mdx = md

# Only documentation pages are linted. STYLE.md and README.md are exempt:
# the style guide quotes the words it bans.
[*.mdx]
BasedOnStyles = Fhenix

# Frontmatter, JSX props, and fenced code blocks are not prose.
TokenIgnores = (\{[^}]*\})
BlockIgnores = (?s) *```.*?```, (?s)^---\n.*?\n---
